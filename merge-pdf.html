<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge PDFs | GMS Toolkit</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head><body><main class="wrap"><a class="back" href="index.html">← GMS Toolkit</a><h1>Merge PDFs</h1><p>Combine several PDFs into one file.</p><div class="privacy">Your selected PDFs are processed in your browser.</div><div class="panel"><p><strong>1.</strong> Choose two or more PDFs in the order you want them combined.</p><input id="files" type="file" accept="application/pdf" multiple><p><button id="go">Merge and download</button></p></div></main><script>document.querySelector('#go').onclick=async()=>{const fs=[...document.querySelector('#files').files];if(fs.length<2)return alert('Choose at least two PDFs.');const out=await PDFLib.PDFDocument.create();for(const f of fs){const d=await PDFLib.PDFDocument.load(await f.arrayBuffer());const ps=await out.copyPages(d,d.getPageIndices());ps.forEach(p=>out.addPage(p))}const b=await out.save(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='merged.pdf';a.click()}</script></body></html>
