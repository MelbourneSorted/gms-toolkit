<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo to PDF | GMS Toolkit</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head><body><main class="wrap"><a class="back" href="index.html">← GMS Toolkit</a><h1>Photo to PDF</h1><p>Turn one or more JPG or PNG images into a PDF.</p><div class="privacy">Images are processed in your browser.</div><div class="panel"><input id="files" type="file" accept="image/jpeg,image/png" multiple><p><button id="go">Create PDF</button></p></div></main><script>document.querySelector('#go').onclick=async()=>{let fs=[...document.querySelector('#files').files];if(!fs.length)return alert('Choose at least one image.');let d=await PDFLib.PDFDocument.create();for(let f of fs){let b=await f.arrayBuffer(),im=f.type==='image/png'?await d.embedPng(b):await d.embedJpg(b),dim=im.scale(1),maxW=595,maxH=842,s=Math.min(maxW/dim.width,maxH/dim.height,1),p=d.addPage([maxW,maxH]),w=dim.width*s,h=dim.height*s;p.drawImage(im,{x:(maxW-w)/2,y:(maxH-h)/2,width:w,height:h})}let b=await d.save(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download='photos.pdf';a.click()}</script></body></html>
