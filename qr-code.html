<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make a QR Code | GMS Toolkit</title><link rel="stylesheet" href="common.css"><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script></head><body><main class="wrap"><a class="back" href="index.html">← GMS Toolkit</a><h1>Make a QR Code</h1><p>Create a QR code for a web address or short text.</p><div class="panel"><input id="text" style="width:80%" placeholder="Paste a web address or type text"><p><button id="go">Make QR code</button></p><canvas id="qr"></canvas><p><button id="save" class="secondary" style="display:none">Download PNG</button></p></div></main><script>let q=document.querySelector('#qr');document.querySelector('#go').onclick=()=>{let t=document.querySelector('#text').value.trim();if(!t)return;QRCode.toCanvas(q,t,{width:320},e=>{if(e)alert(e);else document.querySelector('#save').style.display='inline-block'})};document.querySelector('#save').onclick=()=>{let a=document.createElement('a');a.href=q.toDataURL('image/png');a.download='qr-code.png';a.click()}</script></body></html>
